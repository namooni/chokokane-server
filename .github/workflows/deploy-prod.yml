name: Deploy Backend Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Steup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar

      - name: Prepare JAR
        run: |
          JAR_FILE=$(find build/libs -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          cp "$JAR_FILE" chokokane-server.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Upload JAR to S3
        run: |
          aws s3 cp chokokane-server.jar \
            s3://chokokane-server-deploy-174135521834/chokokane-server.jar

      - name: Deploy with SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0d68a02994d272a11" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "set -e",
              "aws s3 cp s3://chokokane-server-deploy-174135521834/chokokane-server.jar /opt/chokokane/chokokane-server.jar.new",
              "chown ec2-user:ec2-user /opt/chokokane/chokokane-server.jar.new",
              "mv /opt/chokokane/chokokane-server.jar.new /opt/chokokane/chokokane-server.jar",
              "systemctl restart chokokane",
              "systemctl is-active --quiet chokokane"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d68a02994d272a11"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-0d68a02994d272a11"
