spring.application.name=chokokane-server

mybatis.mapper-locations=classpath:mapper/**/*.xml

jwt.secret=${JWT_SECRET}

turnstile.secret-key=${TURNSTILE_SECRET_KEY}
turnstile.expected-hostname=${TURNSTILE_EXPECTED_HOSTNAME}
turnstile.expected-action=password_reset

spring.mail.host=${SMTP_HOST}
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.default-encoding=UTF-8

spring.mail.properties[mail.smtp.auth]=true
spring.mail.properties[mail.smtp.starttls.enable]=true
spring.mail.properties[mail.smtp.starttls.required]=true
spring.mail.properties[mail.smtp.ssl.checkserveridentity]=true

spring.mail.properties[mail.smtp.connectiontimeout]=5000
spring.mail.properties[mail.smtp.timeout]=5000
spring.mail.properties[mail.smtp.writetimeout]=5000

app.mail.from=no-reply@chokokane.site