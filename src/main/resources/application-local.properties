app.environment=local

spring.config.import=optional:classpath:application-local-secret.properties

spring.datasource.url=jdbc:mysql://localhost:3306/chokokane
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

logging.level.com.example.chokokane=DEBUG

app.cookie.secure=false
app.cookie.same-site=Lax

app.cors.allowed-origins=http://localhost:5173

turnstile.secret-key=${TURNSTILE_SECRET_KEY}
turnstile.expected-hostname=localhost
turnstile.expected-action=test
turnstile.test-mode=true

app.password-reset.url=http://localhost:5173/reset-password
