app.environment=prod

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

logging.level.com.example.chokokane=INFO

app.cookie.secure=true
app.cookie.same-site=Lax

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

server.forward-headers-strategy=framework

turnstile.secret-key=${TURNSTILE_SECRET_KEY}
turnstile.expected-hostname=chokokane.site
turnstile.expected-action=password_reset

app.password-reset.url=https://chokokane.site/reset-password

server.address=127.0.0.1